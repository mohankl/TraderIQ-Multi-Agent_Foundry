[project]
name = "finbot-mcp"
version = "0.1.0"
description = "MCP server exposing FinBot tools (yfinance, SerpAPI, Wikipedia, Yahoo Finance News)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.2.0",
    "uvicorn[standard]>=0.42.0",
    "starlette>=0.41.0",
    "yfinance>=1.2.0",
    "google-search-results>=2.4.2",
    "wikipedia>=1.4.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
]
