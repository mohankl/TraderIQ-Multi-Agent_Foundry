[project]
name = "tradingiq"
version = "0.1.0"
description = "Thin FastAPI client for the Trading IQ Foundry agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "azure-ai-projects>=2.1.0",
    "azure-identity>=1.20.0",
    "ag-ui-protocol>=0.1.0",
    # OTel pins resolved as a known-compatible set (May 2026). The
    # azure-monitor-opentelemetry-exporter <=1.0.0b45 imports `LogData`
    # from opentelemetry.sdk._logs which was removed in sdk 1.41, so we
    # need the exporter at 1.0.0b50+ AND opentelemetry-sdk pinned <1.41
    # OR the matching newer exporter. The 1.8.8 / 1.40.0 set was verified
    # to import + initialize cleanly. Don't relax these without testing.
    "opentelemetry-api>=1.40.0,<1.41",
    "opentelemetry-sdk>=1.40.0,<1.41",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "azure-monitor-opentelemetry>=1.8.8",
    "azure-monitor-opentelemetry-exporter>=1.0.0b52",
    "azure-core-tracing-opentelemetry>=1.0.0b11",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade
ignore = [
    "E501",  # line-too-long — handled by formatter, not lint
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
