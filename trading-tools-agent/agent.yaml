kind: hosted
name: trading-tools-agent
protocols:
  - protocol: responses
    version: 1.0.0
resources:
  cpu: "0.25"
  memory: 0.5Gi
environment_variables:
  # FOUNDRY_PROJECT_ENDPOINT and FOUNDRY_AGENT_TOOLBOX_* are injected
  # automatically by the platform at runtime — do NOT declare them here.
  - name: MODEL_DEPLOYMENT_NAME
    value: "grok-4.3"
  - name: TOOLBOX_ENDPOINT
    value: "https://alpha-state-trading-multi-agent.services.ai.azure.com/api/projects/alpha-state-trading-MMA/toolboxes/trading-tools/mcp?api-version=v1"
dockerfile_path: Dockerfile