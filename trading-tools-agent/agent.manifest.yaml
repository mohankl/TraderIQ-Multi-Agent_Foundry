name: trading-tools-agent
description: >
  An Agent Framework agent with Foundry Toolbox integration.
metadata:
  tags:
    - AI Agent Hosting
    - Agent Framework
    - Responses Protocol
    - Streaming
    - Toolbox
    - MCP
template:
  name: trading-tools-agent
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: MODEL_DEPLOYMENT_NAME
      value: ${MODEL_DEPLOYMENT_NAME}
    - name: TOOLBOX_ENDPOINT
      value: ${TOOLBOX_ENDPOINT}
parameters:
  properties: []
resources:
  - kind: model
    id: gpt-4.1
    name: MODEL_DEPLOYMENT_NAME
